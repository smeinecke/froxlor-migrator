<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1" keyTimes="0.00000;0.11071;0.12143;0.98929;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13">$ uv run python main.py --config config.toml</text><rect x="24" y="60" width="347" height="18" fill="#0d1117"><animate attributeName="x" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="24;24;373;373" keyTimes="0;0.01429;0.06429;1"/><animate attributeName="width" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="347;347;0;0" keyTimes="0;0.01429;0.06429;1"/></rect><rect x="24" y="61" width="8" height="15" fill="#3fb950"><animate attributeName="x" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="24;24;373;373" keyTimes="0;0.01429;0.06429;1"/><animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1"/></rect><g><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0.00000;0.07500;0.08750;1.00000"/><text x="22" y="116" fill="#e6edf3" font-size="13" font-weight="bold">Froxlor Migrator</text><text x="22" y="137" fill="#8b949e" font-size="13">Connecting to source and target panels…</text></g><g><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0.00000;0.10357;0.11607;1.00000"/><text x="22" y="179" fill="#3fb950" font-size="13">✓ source api ok</text><text x="192" y="179" fill="#3fb950" font-size="13">✓ target api ok</text><text x="362" y="179" fill="#3fb950" font-size="13">✓ 3 customers loaded</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.12143;0.13214;0.21786;0.22857;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 1 — Source customer(s)</text><text x="22" y="95" fill="#8b949e" font-size="13">Select customers to migrate — multiple selections run as a sequential batch.</text><rect x="14" y="122" width="720" height="21" fill="rgba(56,139,253,0.18)" rx="4"/><text x="22" y="137" fill="#58a6ff" font-size="13">▸</text><text x="40" y="137" fill="#e6edf3" font-size="13">[x] custalpha — Alpha GmbH</text><text x="560" y="137" fill="#8b949e" font-size="13">(id 10001)</text><text x="40" y="158" fill="#c9d1d9" font-size="13">[ ] custbeta  — Beta Solutions</text><text x="560" y="158" fill="#8b949e" font-size="13">(id 10002)</text><text x="40" y="179" fill="#c9d1d9" font-size="13">[ ] custgamma — Gamma Shop</text><text x="560" y="179" fill="#8b949e" font-size="13">(id 10003)</text><rect x="272.4" y="227" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="244" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="227" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="244" fill="#c9d1d9" font-size="13" text-anchor="middle">Quit</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.22857;0.23929;0.31071;0.32143;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 2 — Migration mode</text><text x="22" y="95" fill="#8b949e" font-size="13">Whole customer migrates every resource; domain-only lets you pick.</text><text x="22" y="137" fill="#58a6ff" font-size="13">(•)</text><text x="52" y="137" fill="#e6edf3" font-size="13">Whole customer (all domains, files, databases, mailboxes, settings)</text><text x="22" y="158" fill="#8b949e" font-size="13">( )</text><text x="52" y="158" fill="#c9d1d9" font-size="13">Domain-only (choose individual resources)</text><rect x="272.4" y="227" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="244" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="227" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="244" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.32143;0.33214;0.40357;0.41429;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 3 — Domains</text><text x="22" y="95" fill="#8b949e" font-size="13">Select domains to migrate. Domains outside source_web_root are skipped.</text><text x="22" y="137" fill="#e6edf3" font-size="13">[x] alpha.example</text><text x="290" y="137" fill="#8b949e" font-size="13">/var/customers/webs/alpha</text><text x="590" y="137" fill="#8b949e" font-size="13">php=8.3 ssl=1</text><rect x="14" y="143" width="720" height="21" fill="rgba(56,139,253,0.18)" rx="4"/><text x="22" y="158" fill="#e6edf3" font-size="13">[x] shop.alpha.example</text><text x="290" y="158" fill="#8b949e" font-size="13">/var/customers/webs/shop</text><text x="590" y="158" fill="#8b949e" font-size="13">php=8.3 ssl=1</text><text x="22" y="179" fill="#8b949e" font-size="13">[ ] old.example.net</text><text x="290" y="179" fill="#8b949e" font-size="13">/srv/old (outside web root — skipped)</text><rect x="272.4" y="227" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="244" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="227" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="244" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.41429;0.42500;0.49643;0.50714;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 4 — Resources</text><text x="22" y="95" fill="#8b949e" font-size="13">Mail forwarders, sender aliases and SSH keys follow selections automatically.</text><rect x="101.0" y="122" width="98.0" height="24" fill="#21262d" rx="6" stroke="#30363d"/><text x="150" y="138" fill="#8b949e" font-size="12" text-anchor="middle">Subdomains</text><rect x="226.9" y="122" width="90.2" height="24" fill="#1f6feb33" rx="6" stroke="#58a6ff"/><text x="272" y="138" fill="#e6edf3" font-size="12" text-anchor="middle">Databases</text><rect x="336.9" y="122" width="90.2" height="24" fill="#21262d" rx="6" stroke="#30363d"/><text x="382" y="138" fill="#8b949e" font-size="12" text-anchor="middle">Mailboxes</text><rect x="447.2" y="122" width="113.6" height="24" fill="#21262d" rx="6" stroke="#30363d"/><text x="504" y="138" fill="#8b949e" font-size="12" text-anchor="middle">FTP accounts</text><text x="22" y="179" fill="#e6edf3" font-size="13">[x] custalpha_wpdemo</text><text x="320" y="179" fill="#8b949e" font-size="13">WordPress demo</text><text x="560" y="179" fill="#8b949e" font-size="13">(mysql1)</text><rect x="14" y="185" width="720" height="21" fill="rgba(56,139,253,0.18)" rx="4"/><text x="22" y="200" fill="#c9d1d9" font-size="13">[ ] custalpha_old</text><text x="320" y="200" fill="#8b949e" font-size="13">Legacy archive</text><text x="560" y="200" fill="#8b949e" font-size="13">(mysql1)</text><rect x="272.4" y="248" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="265" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="248" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="265" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.50714;0.51786;0.58929;0.60000;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 5 — PHP &amp; IP mappings</text><text x="22" y="95" fill="#8b949e" font-size="13">Map source PHP settings and IP:port bindings to target IDs.</text><text x="22" y="137" fill="#c9d1d9" font-size="13">Source PHP setting id 3 -&gt;</text><rect x="42" y="143" width="460" height="24" fill="#21262d" rx="6" stroke="#30363d"/><text x="54" y="158" fill="#e6edf3" font-size="13">fpm 8.3 (/usr/bin/php8.3)</text><text x="478" y="158" fill="#8b949e" font-size="13">▼</text><text x="22" y="200" fill="#c9d1d9" font-size="13">Source IP 192.0.2.10:80 ssl=1 (id 5) -&gt;</text><rect x="42" y="206" width="460" height="24" fill="#21262d" rx="6" stroke="#30363d"/><text x="54" y="221" fill="#e6edf3" font-size="13">198.51.100.20:80 ssl=1</text><text x="478" y="221" fill="#8b949e" font-size="13">▼</text><rect x="272.4" y="269" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="286" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="269" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="286" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.60000;0.61071;0.67500;0.68571;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 6 — Options</text><text x="22" y="95" fill="#8b949e" font-size="13">Choose what gets transferred. Unchecked items are skipped entirely.</text><text x="22" y="137" fill="#e6edf3" font-size="13">[x] Transfer website files (docroots via tar)</text><text x="22" y="158" fill="#e6edf3" font-size="13">[x] Transfer database schema + data</text><text x="22" y="179" fill="#e6edf3" font-size="13">[x] Transfer mailbox content via doveadm backup</text><text x="22" y="200" fill="#e6edf3" font-size="13">[x] Sync password hashes (customer, FTP, mailbox, htpasswd, DB)</text><text x="22" y="221" fill="#8b949e" font-size="13">[ ] Dry run (plan only, no changes)</text><rect x="272.4" y="248" width="55.2" height="26" rx="6" fill="#1f6feb"/><text x="300" y="265" fill="#ffffff" font-size="13" text-anchor="middle">Next</text><rect x="392.4" y="248" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="420" y="265" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
<g opacity="0"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0.00000;0.68571;0.69643;0.76786;0.77857;1.00000"/><text x="22" y="74" fill="#e6edf3" font-size="13" font-weight="bold">Step 7 — Review &amp; start</text><text x="22" y="95" fill="#8b949e" font-size="13">Verify the plan, then start the migration.</text><text x="22" y="137" fill="#8b949e" font-size="13">Item</text><text x="220" y="137" fill="#8b949e" font-size="13">Value</text><rect x="16" y="131" width="700" height="1" fill="#30363d"/><text x="22" y="158" fill="#c9d1d9" font-size="13">Customer</text><text x="220" y="158" fill="#e6edf3" font-size="13">custalpha (id 10001) → new customer</text><text x="22" y="179" fill="#c9d1d9" font-size="13">Domains</text><text x="220" y="179" fill="#e6edf3" font-size="13">2 (+1 outside web root, skipped)</text><text x="22" y="200" fill="#c9d1d9" font-size="13">Resources</text><text x="220" y="200" fill="#e6edf3" font-size="13">1 db · 4 mailboxes · 2 ftp · files+mail</text><text x="22" y="242" fill="#8b949e" font-size="13">Replay:</text><text x="92" y="242" fill="#39c5cf" font-size="13">main.py --non-interactive --apply --source-customer custalpha …</text><rect x="249.5" y="269" width="141.0" height="26" rx="6" fill="#238636"/><text x="320" y="286" fill="#ffffff" font-size="13" text-anchor="middle">Start migration</text><rect x="442.4" y="269" width="55.2" height="26" rx="6" fill="#21262d" stroke="#30363d"/><text x="470" y="286" fill="#c9d1d9" font-size="13" text-anchor="middle">Back</text></g>
