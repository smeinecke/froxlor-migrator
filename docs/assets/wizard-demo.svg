ferred (1.2 GiB via pzstd)</text><text x="22" y="221" fill="#8b949e" font-size="13"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0.00000;0.85357;0.86250;1.00000"/>[7/9] mailboxes synced via doveadm</text><text x="22" y="242" fill="#3fb950" font-size="13"><animate attributeName="opacity" dur="28.0s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1" keyTimes="0.00000;0.87857;0.88750;1.00000"/>[9/9] password hashes synced</text></g>
