[project]
name = "froxlor-migrator"
version = "0.1.0"
description = "Source-side Froxlor migration TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = [
  "paramiko>=3.5.0",
  "pymysql>=1.1.1",
  "requests>=2.32.0",
  "rich>=13.7.0",
  "textual>=8.2.8",
  "tomli>=2.0.1",
]

[project.scripts]
froxlor-migrator = "froxlor_migrator.tui:run_app"
froxlor-migrator-verify = "froxlor_migrator.verify_migration:main"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "pyright>=1.1.400",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "mutmut>=3.3",
  "pytest-timeout>=2.4",
  "ruff>=0.11.0",
  "vulture>=2.15",
  "xenon>=0.9.3",
]

[tool.ruff]
exclude = ["docs", "testing"]
target-version = "py310"
line-length = 160
indent-width = 4  # Same as autopep8 default

[tool.ruff.format]
quote-style = "double"  # Or "single" if you prefer
indent-style = "space"  # Use spaces instead of tabs
line-ending = "lf"  # Keep consistency
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [
  "froxlor_migrator",
  "main.py",
  "testing/bootstrap/seed_source.py",
  "testing/bootstrap/build_install_input.py",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=froxlor_migrator",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
pythonpath = ["."]
norecursedirs = [
    "testing/data",
]
markers = [
    "integration: real integration tests that require external services/tools",
]

[tool.coverage.report]
fail_under = 75

[tool.bandit]
exclude_dirs = [".venv", "tests", "dist", "build", "testing"]
# Inherent to a migration tool whose core job is building remote commands and
# SQL from API data: subprocess/paramiko shell-out, PATH-resolved binaries,
# string-built SQL, remote /tmp paths, and best-effort probe except-blocks.
# `random` is only used for logfile suffixes; B507 is inline-nosec'd.
skips = ["B404", "B603", "B607", "B601", "B608", "B108", "B110", "B112", "B105"]

[tool.vulture]
exclude = ["dist", "build", "venv", ".venv", "tests", "docs"]
min_confidence = 80
paths = ["."]
sort_by_size = true

[tool.mutmut]
source_paths = ["froxlor_migrator/"]
pytest_add_cli_args_test_selection = ["tests/", "-m", "not integration"]
# --no-cov must apply to stats/mutant runs too: the fail_under gate would
# otherwise abort the run during mutmut's own stats collection.
pytest_add_cli_args = ["-x", "-q", "--no-cov", "--timeout=60"]
mutate_only_covered_lines = true
# Lines whose mutations can never change behaviour.
do_not_mutate_patterns = [
    '^\s*logger\.',
    '^\s*self\.runner\.debug_event',
]
