name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff (formatting)
        run: uv run ruff format --check --diff .

      - name: Ruff (linting)
        run: uv run ruff check .

      - name: Vulture (dead code)
        run: uv run vulture . --exclude .venv,migrations,tests,docs,testing --make-whitelist

      - name: Xenon (cyclomatic complexity)
        run: uv run xenon -b C -m B -a B froxlor_migrator

      - name: Bandit (security)
        run: uv run bandit -c pyproject.toml -r froxlor_migrator

      - name: Pyright (type check)
        run: uv run pyright

      - name: Compile check
        run: uv run python -m compileall .

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Run pytest
        run: |
          # --no-sync: sync already built the venv for the matrix python;
          # a bare `uv run` would re-resolve against requires-python.
          uv run --no-sync pytest tests -v -m "not integration"

      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./coverage.xml

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [validate, test]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "COMPOSE_PROJECT_NAME=froxlorint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> .env
          echo "BOOTSTRAP_RUN_MIGRATION_VERIFY=1" >> .env
        working-directory: testing

      - name: Run full integration test
        run: docker compose --profile bootstrap run --rm bootstrap
        working-directory: testing

      - name: Relax test data permissions for artifact upload
        if: failure()
        run: sudo chmod -R a+rX testing/data || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs
          path: |
            testing/data/**/*.log
            testing/logs/
            manifests/
          if-no-files-found: ignore
