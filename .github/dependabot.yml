# Dependabot version updates for all dependency ecosystems in this repo.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/testing/froxlor"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker-compose"
    directory: "/testing"
    schedule:
      interval: "monthly"
